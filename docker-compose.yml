services:
  deepkey:
    build: .
    # Loopback only. This instance speaks plain HTTP, so put a TLS reverse proxy in front before
    # exposing it to anything other than this machine.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      DEEPKEY_DATA_DIR: /data
      DEEPKEY_HOST: 0.0.0.0
      DEEPKEY_PORT: 8787
    volumes:
      - deepkey-data:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  deepkey-data:
